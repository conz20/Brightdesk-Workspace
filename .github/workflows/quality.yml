name: Brightdesk app quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: App tests and Rust engine checks
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # Rust toolchain action pinned
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Check Rust formatting, lint, tests and native build
        run: npm run rust:check

      - name: Run application tests with the native engine required
        env:
          BRIGHTDESK_REQUIRE_NATIVE_ENGINE: "1"
        run: npm test

      - name: Verify release configuration
        run: npm run release:preflight
