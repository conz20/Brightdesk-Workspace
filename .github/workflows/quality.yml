name: Brightdesk app quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: App tests and Rust engine checks
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: Set up the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Check Rust formatting, lint, tests and native build
        run: npm run rust:check

      - name: Run application tests with the native engine required
        env:
          BRIGHTDESK_REQUIRE_NATIVE_ENGINE: "1"
        run: npm test

      - name: Verify release configuration
        run: npm run release:preflight
